name: store-web

services:

  site:
    image: nginx:latest
    volumes:
      - ${APP}:/usr/share/nginx/html:ro

  load-balancer:
    image: nginx:latest
    deploy:
      mode: global
    volumes:
      - ${SETUP}/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 8080:80
    depends_on:
      - site
