name: store-api

services:

  db:
    image: postgres:17.7
    hostname: db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # ports:
    #   - 5432:5432
    volumes:
      - ./volume/db:/var/lib/postgresql/data

  account:
    build:
      context: ./account-service
      dockerfile: Dockerfile
    hostname: account
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
    restart: always
    deploy:
      replicas: 1
    depends_on:
      - db

  auth:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    hostname: auth
    environment:
      STORE_JWT_SECRET_KEY: ${STORE_JWT_SECRET_KEY:?error}
      STORE_TOKEN_DURATION: ${STORE_TOKEN_DURATION:-3600000} # 1 hour in milliseconds
      STORE_TOKEN_HTTPS: ${STORE_TOKEN_HTTPS:-true}

  gateway:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?error}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}

  loadbalancer:
    image: nginx:latest
    hostname: loadbalancer
    deploy:
      mode: global
    volumes:
      - $SETUP/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 80:80

  prometheus:
    image: prom/prometheus:latest
    hostname: prometheus
    ports:
      - 9090:9090
    volumes:
      - $SETUP/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana-enterprise
    hostname: grafana
    ports:
      - 3000:3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - $SETUP/grafana:/var/lib/grafana
      - $SETUP/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    restart: always
